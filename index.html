<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>চেতনার আধার</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#fff8f0;color:#333;text-align:center}
.h{padding:12px;background:linear-gradient(90deg,#ff9a9e,#fecfef);font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px;max-width:600px;margin:auto}
.b{padding:14px;border-radius:12px;background:#fff;box-shadow:0 2px 8px #0001;cursor:pointer}
.b.sharot{background:#fff3e0}.b.shit{background:#e0f7fa}.b.premer{background:#fce4ec}
.poem{display:none;margin:8px auto;max-width:600px;background:#fff;padding:12px;border-radius:12px;white-space:pre-wrap}
.poem.show{display:block}.center{text-align:center}
.ctrl{padding:8px;max-width:600px;margin:auto;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.btn{padding:6px 10px;border:0;border-radius:8px;background:#333;color:#fff;font-size:13px}
.edit{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#0008;z-index:99;align-items:center;justify-content:center}
.edit.show{display:flex}.box{background:#fff;padding:12px;border-radius:12px;width:90%;max-width:400px}
input,textarea{width:100%;margin:6px 0;padding:8px;border:1px solid #ddd;border-radius:8px}
</style></head><body>
<div class="h">চেতনার আধার - ১০ দরজা</div>
<div class="ctrl">
<button class="btn" onclick="toggleAll(0)">সব কবিতা বন্ধ</button>
<button class="btn" onclick="toggleAll(1)">সাইট টু সাইট খোলা</button>
<button class="btn" onclick="showLatest()">সর্বশেষ কবিতা</button>
</div>
<div class="grid" id="grid"></div>
<div id="poems"></div>
<div class="b premer" style="max-width:600px;margin:8px auto">প্রেমের বিজ্ঞাপন - মাঝে থাকবে</div>
<div class="edit" id="editBox"><div class="box">
<input id="eTitle" placeholder="ব্লক টাইটেল"><textarea id="ePoem" rows="6" placeholder="কবিতা"></textarea>
<button class="btn" onclick="saveEdit()">সেভ (শীট টু পেজ)</button>
<button class="btn" onclick="closeEdit()" style="background:#999">বন্ধ</button></div></div>
<script>
const RITU=["বসন্ত","গ্রীষ্ম","বর্ষা","শরৎ","হেমন্ত","শীত","প্রেম","স্মৃতি","আলো","ছায়া"];
const poems=JSON.parse(localStorage.getItem('chetona')||'[]');
let cur=null,lpTimer=null;
function render(){
 const g=document.getElementById('grid');g.innerHTML='';
 RITU.forEach((r,i)=>{
  let d=document.createElement('div');d.className='b '+(r=='শরৎ'?'sharot':r=='শীত'?'shit':r=='প্রেম'?'premer':'');
  d.innerHTML=r;d.dataset.i=i;
  d.onpointerdown=()=>{lpTimer=setTimeout(()=>openEdit(i),700)};
  d.onpointerup=()=>clearTimeout(lpTimer);d.onpointerleave=()=>clearTimeout(lpTimer);
  d.onclick=()=>{if(r=='শীত'){let p=prompt('শীতের দরজা পাসওয়ার্ড');if(p!=='1234')return alert('ভুল');}openPoem(i)};
  g.appendChild(d);
 });renderPoems();
}
function renderPoems(){
 const c=document.getElementById('poems');c.innerHTML='';
 poems.forEach((p,i)=>{
  let d=document.createElement('div');d.className='poem center';d.id='p'+i;
  d.innerHTML='<b>'+p.t+'</b><br>'+p.k;d.dataset.i=i;
  d.onpointerdown=()=>{lpTimer=setTimeout(()=>openEdit(i),800)};d.onpointerup=()=>clearTimeout(lpTimer);
  c.appendChild(d);
 });
}
function openPoem(i){document.querySelectorAll('.poem').forEach(e=>e.classList.remove('show'));let el=document.getElementById('p'+i);if(el)el.classList.add('show');}
function showLatest(){if(!poems.length)return alert('কবিতা নেই');document.querySelectorAll('.poem').forEach(e=>e.classList.remove('show'));document.getElementById('p'+(poems.length-1)).classList.add('show');}
function toggleAll(o){if(o==0){document.querySelectorAll('.poem').forEach(e=>e.classList.remove('show'))}else{document.querySelectorAll('.poem').forEach(e=>e.classList.add('show'))}}
function openEdit(i){cur=i;let p=poems[i]||{t:RITU[i]||'',k:''};document.getElementById('eTitle').value=p.t;document.getElementById('ePoem').value=p.k;document.getElementById('editBox').classList.add('show');}
function closeEdit(){document.getElementById('editBox').classList.remove('show');}
function saveEdit(){
 let t=document.getElementById('eTitle').value,k=document.getElementById('ePoem').value;
 poems[cur]={t,k};localStorage.setItem('chetona',JSON.stringify(poems));
 closeEdit();renderPoems();showLatest();
}
render();
</script></body></html>
