<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ভাস্কর ডিজিটাল স্টুডিও</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff6e8;font-family:system-ui}
.app{width:100%;min-height:100vh;background:#fffaf3;padding-bottom:110px}
.header{background:linear-gradient(135deg,#4a00e0,#8e2de2);padding:18px 10px 12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.diya{width:80px;height:80px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;border:2.5px solid #ffcc33;box-shadow:0 0 18px #ffcc33;margin:0 auto}
.header h1{font-size:24px;color:#00FF7F;line-height:1.25;font-weight:700;margin-top:8px}
.highlight-box{width:100%;background:linear-gradient(90deg,#fff8c0,#ffffff);color:#4a00e0;padding:10px 8px;border-radius:14px;font-size:21px;font-weight:900;text-align:center;margin-top:12px;border:2.5px solid #ffcc33;box-shadow:0 0 18px #ffe680, 0 5px 15px #0004}
.search{margin:12px 10px 0 10px;background:#fff;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;box-shadow:0 6px 16px #0002}
.search input{flex:1;border:none;outline:none;font-size:14px;margin-left:6px}
.sec{padding:14px 10px 0 10px}.sec h2{font-size:16px;display:flex;justify-content:space-between;margin-bottom:10px}.sec h2 span{font-size:11px;color:#ff6a2a}
.pill{height:60px;border-radius:30px;padding:0 16px;margin:8px 0;display:flex;gap:12px;align-items:center;color:#fff;cursor:pointer}
.pill b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill small{font-size:11px;opacity:.9}
.ic{width:34px;height:34px;min-width:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px}
.poem{display:none;background:#fffbe0;border:2px solid #ffd36a;border-radius:10px;padding:12px;margin:5px 0 10px 0;white-space:pre-line;font-size:13px;line-height:1.9;color:#222}
.g{background:linear-gradient(90deg,#0bb36a,#3ed68a)}.o{background:linear-gradient(90deg,#ff7e1a,#ffb02e)}.b{background:linear-gradient(90deg,#2d7bff,#5a9bff)}.pu{background:linear-gradient(90deg,#6b4cff,#8a6cff)}.pi{background:linear-gradient(90deg,#ff4a8a,#ff7ca8)}.te{background:linear-gradient(90deg,#0faa9a,#2fd18c)}.re{background:linear-gradient(90deg,#ff3a2e,#ff7a3d)}.in{background:linear-gradient(90deg,#5a5aff,#8a5aff)}
.my-card{border-radius:18px;padding:14px 16px;margin:10px 0;color:#fff}
.my-card h3{font-size:16px;margin-bottom:4px}.my-card p{font-size:13px;white-space:pre-line;line-height:1.6}
.bottom{position:fixed;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:999}
.bi{font-size:9px;color:#888;text-align:center}.bi.on{color:#e14a2a;font-weight:700}.bi div{font-size:18px}
.addBtn{position:fixed;right:18px;bottom:70px;width:56px;height:56px;background:#4a00e0;color:#fff;border-radius:50%;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:1000}
.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#0008;z-index:2000;align-items:center;justify-content:center}
.modalBox{background:#fff;width:90%;max-width:360px;border-radius:14px;padding:14px}
.modalBox input,.modalBox textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px;font-size:14px}
.modalBox button{width:100%;margin-top:10px;background:#4a00e0;color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:700}
</style></head><body>
<div class="app">
<div class="header"><div class="diya">🪔</div><h1>ভাস্কর ডিজিটাল<br>স্টুডিওর প্রথম নিবেদন</h1><div class="highlight-box">❤️ বিবেকের আলোক দর্শন ❤️</div></div>
<div class="search">🔍<input id="searchBox" placeholder="কবিতা খুঁজুন..."></div>
<div class="sec">
<h2>আমার লেখা <span id="count">লোড হচ্ছে...</span></h2>
<div id="myPoems"></div>
</div>
<div class="addBtn" onclick="openModal()">+</div>
<div class="bottom"><div class="bi on"><div>🏠</div>হোম</div><div class="bi"><div>🤍</div>পছন্দ</div><div class="bi"><div>📚</div>লাইব্রেরী</div><div class="bi"><div>👤</div>প্রোফাইল</div></div>
</div>
<div class="modal" id="modal"><div class="modalBox">
<h3>নতুন কবিতা যোগ করুন</h3>
<input id="t" placeholder="কবিতার নাম">
<textarea id="c" rows="6" placeholder="কবিতা লিখুন..."></textarea>
<button onclick="savePoem()">সেভ করুন</button>
<button onclick="closeModal()" style="background:#eee;color:#333">বাতিল</button>
</div></div>
<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzdmiQUjLIMtAt3TsBkjcXHnm1u-QPZNc0GRmXPoi43gfvvXA5MJdG6uDcV1IWOpmjNIw/exec';
let colors=['g','o','b','pu','pi','te','re','in'];
let allData=[];
function openModal(){document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function loadPoems(){
  fetch(SHEET_URL).then(r=>r.json()).then(data=>{
    allData=data;
    let box=document.getElementById('myPoems');
    document.getElementById('count').innerText='('+data.length+'টি)';
    box.innerHTML='';
    data.slice().reverse().forEach((po)=>{
      let col=colors[po.id % colors.length];
      box.innerHTML+=`<div class="my-card ${col}"><h3>${po.title}</h3><p>${po.text}</p><div style="margin-top:12px;display:flex;gap:10px"><button onclick="editPoem(${po.id})" style="flex:1;border:none;padding:8px 0;border-radius:20px;background:#fff;color:#000;font-weight:700">✏️ এডিট</button><button onclick="delPoem(${po.id})" style="flex:1;border:none;padding:8px 0;border-radius:20px;background:#000;color:#fff;font-weight:700">🗑️ ডিলিট</button></div></div>`;
    });
  });
}
function savePoem(){
  let title=document.getElementById('t').value.trim();
  let text=document.getElementById('c').value.trim();
  if(!title||!text){alert('নাম ও কবিতা লিখুন');return;}
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({title:title,text:text,date:new Date().toLocaleString()})});
  document.getElementById('t').value='';document.getElementById('c').value='';closeModal();alert('সেভ হয়েছে বস!');setTimeout(loadPoems,2500);
}
function delPoem(id){
  if(!confirm('ডিলিট করবেন বস? সবার ফোন থেকে মুছে যাবে!'))return;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'delete',id:id})});
  alert('ডিলিট হচ্ছে...');setTimeout(loadPoems,2500);
}
function editPoem(id){
  let po=allData.find(p=>p.id==id); if(!po)return;
  let newTitle=prompt('নাম এডিট করুন:',po.title); if(newTitle===null)return;
  let newText=prompt('কবিতা এডিট করুন:',po.text); if(newText===null)return;
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'edit',id:id,title:newTitle.trim(),text:newText.trim()})});
  alert('আপডেট হচ্ছে...');setTimeout(loadPoems,2500);
}
loadPoems();
</script>
</body></html>
