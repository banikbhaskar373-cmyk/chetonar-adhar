<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভাস্কর ডিজিটাল স্টুডিও</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff3e8;font-family:'Noto Serif Bengali',system-ui}
.app{max-width:430px;margin:auto;background:#fffaf5;min-height:100vh;padding-bottom:90px;position:relative}
.header{background:linear-gradient(135deg,#ff9a2e 0%,#ff7a3d 35%,#e93a6a 100%);padding:28px 18px 42px 18px;border-radius:0 0 28px 28px;position:relative}
.logo{display:flex;align-items:center;gap:12px}
.diya{width:56px;height:56px;background:radial-gradient(circle at 50% 20%,#ffed9a,#8a2a0f);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 4px 12px #0004;border:2px solid #ffd86b}
.brand h1{color:#fff7d6;font-size:29px;line-height:1.1}.brand h1 b{font-size:34px;display:block}.brand p{color:#ffe8c8;font-size:13px;margin-top:5px}
.search-wrap{margin:-22px 16px 0 16px;background:#fff;border-radius:16px;display:flex;align-items:center;padding:12px 14px;box-shadow:0 8px 20px #0002}
.search-wrap input{flex:1;border:none;outline:none;font-size:15px}
.cat{border-radius:30px;padding:13px 16px;margin:11px 0;display:flex;align-items:center;gap:12px;color:#fff;cursor:pointer}
.cat .ic{width:38px;height:38px;background:#fff3;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.cat .txt b{display:block;font-size:17px}.cat .txt span{font-size:11.5px;opacity:.9}
.c-green{background:linear-gradient(90deg,#00b67a,#4ed17a)}.c-orange{background:linear-gradient(90deg,#ff7a18,#ffaa3a)}.c-blue{background:linear-gradient(90deg,#1596ff,#3a7bff)}.c-purple{background:linear-gradient(90deg,#8a4aff,#6a2cff)}.c-pink{background:linear-gradient(90deg,#ff4f8b,#ff7fb3)}.c-teal{background:linear-gradient(90deg,#0fb5a0,#3dd68f)}.c-red{background:linear-gradient(90deg,#ff4a2e,#ff8a3d)}.c-indigo{background:linear-gradient(90deg,#5b5bff,#8e5bff)}
.poem{display:none;margin:-4px 0 12px 0;background:#fffbe6;border:2px solid #ffdd8a;border-radius:14px;padding:14px;white-space:pre-line;line-height:1.85;font-size:15px;color:#222}
.bottom{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:92%;max-width:390px;background:#fff;border-radius:26px;display:flex;justify-content:space-around;padding:8px 4px;box-shadow:0 10px 30px #0003}
.item{text-align:center;color:#999;font-size:11px;padding:4px 12px;border-radius:16px}.item.active{color:#ff6a3d;background:#fff1e6}.ico{font-size:20px;display:block}
.feature{background:linear-gradient(105deg,#ffb03a 0%,#ff7a2e 45%,#e9408a 100%);border-radius:18px;padding:16px 14px;display:flex;justify-content:space-between;color:#fff;cursor:pointer}
.badge{background:#fff3;border:1px solid #fff5;padding:3px 10px;border-radius:20px;font-size:11px;display:inline-block;margin-bottom:8px}
.section{padding:18px 16px 0 16px}.sec-title{display:flex;justify-content:space-between;margin-bottom:12px}.sec-title h2{font-size:19px}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="logo"><div class="diya">🪔</div><div class="brand"><h1>ভাস্কর<br><b>ডিজিটাল স্টুডিও</b></h1><p>বাংলার কবিতা • গল্প • ছন্দ</p></div></div>
</div>
<div class="search-wrap">🔍<input id="q"
