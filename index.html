<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>বিবস্বানের কবিতা</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Anek Bangla',sans-serif}
body{background:#0f0f0f;color:#f5f5f5;padding:20px}
.header{text-align:center;padding:40px 0;border-bottom:1px solid #333}
.header h1{font-size:42px;letter-spacing:2px}
.header p{opacity:0.6;margin-top:8px}
.container{max-width:800px;margin:0 auto}
.poem-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:24px;margin:20px 0}
.poem-card h2{font-size:24px;margin-bottom:12px;color:#ffdb8a}
.poem-card .text{white-space:pre-wrap;line-height:1.8;opacity:0.9;font-size:18px;font-weight:300}
.poem-card .date{margin-top:15px;font-size:13px;opacity:0.4}
.poem-card .edit-btn{background:#2a2a2a;border:none;color:#fff;padding:6px 12px;border-radius:20px;cursor:pointer;margin-top:10px}
#adminBtn{position:fixed;bottom:20px;right:20px;background:#fff;color:#000;border:none;width:50px;height:50px;border-radius:50%;font-size:20px;cursor:pointer}
#adminPanel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000000ee;z-index:100;padding:20px;overflow:auto}
#adminPanel .box{max-width:600px;margin:40px auto;background:#1a1a1a;padding:24px;border-radius:16px}
input, textarea{width:100%;background:#111;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:8px 0;font-size:16px}
button.main{background:#ffdb8a;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<h1>বিবস্বান</h1>
<p>কবিতার খাতা</p>
</div>
<div class="container" id="poemList">লোড হচ্ছে...</div>

<button id="adminBtn" onclick="openAdmin()">✎</button>

<div id="adminPanel">
<div class="box">
<h2 id="adminTitle">Admin Panel</h2>
<div id="loginDiv">
<input type="password" id="pass" placeholder="Password দিন">
<button class="main" onclick="login()">Login</button>
<button class="main" style="background:#222;color:#fff" onclick="closeAdmin()">Close</button>
</div>
<div id="writeDiv" style="display:none">
<input type="hidden" id="editId">
<input type="text" id="pTitle" placeholder="কবিতার নাম">
<textarea id="pText" rows="10" placeholder="কবিতা লিখুন..."></textarea>
<button class="main" onclick="savePoem()">Save / Update</button>
<button class="main" style="background:#222;color:#fff" onclick="closeAdmin()">Close</button>
</div>
</div>
</div>

<script>
// আপনার নতুন ব্ল্যাঙ্ক খাতার লিংক
const API_URL = "https://script.google.com/macros/s/AKfycbxrf0LOVVt6YWl2oKDtxmumr62GDmrAsUJOFEXQ4s93DGBd7RAbBIolG3UNP15Bc17BOA/exec";

let allPoems = [];
let isAdmin = false;

async function loadPoems(){
 try{
  let res = await fetch(API_URL);
  let data = await res.json();
  allPoems = data.reverse();
  let html = "";
  data.reverse().forEach(p=>{
   html += `<div class="poem-card">
    <h2>${p.title}</h2>
    <div class="text">${p.text}</div>
    <div class="date">${p.date || ''}</div>
    ${isAdmin ? `<button class="edit-btn" onclick="editPoem(${p.id})">Edit</button>` : ''}
   </div>`;
  });
  if(data.length==0) html = "<p style='text-align:center;opacity:0.5;margin-top:40px'>এখনো কোনো কবিতা নেই। Admin থেকে লিখুন।</p>";
  document.getElementById("poemList").innerHTML = html;
 } catch(e){
  document.getElementById("poemList").innerHTML = "Error loading poems";
 }
}

function openAdmin(){
 document.getElementById("adminPanel").style.display="block";
}
function closeAdmin(){
 document.getElementById("adminPanel").style.display="none";
}
function login(){
 if(document.getElementById("pass").value=="1234"){
  isAdmin=true;
  document.getElementById("loginDiv").style.display="none";
  document.getElementById("writeDiv").style.display="block";
  document.getElementById("adminTitle").innerText="নতুন কবিতা লিখুন";
  loadPoems();
 } else { alert("ভুল পাসওয়ার্ড!"); }
}

async function savePoem(){
 let title = document.getElementById("pTitle").value;
 let text = document.getElementById("pText").value;
 let id = document.getElementById("editId").value;
 if(!title || !text){ alert("সব লিখুন"); return; }
 let payload = {title, text, date: new Date().toLocaleDateString('bn-BD')};
 if(id){ payload.action="edit"; payload.id=id; }
 await fetch(API_URL, {method:"POST", body:JSON.stringify(payload)});
 document.getElementById("pTitle").value=""; document.getElementById("pText").value=""; document.getElementById("editId").value="";
 closeAdmin();
 loadPoems();
}

function editPoem(id){
 let p = allPoems.find(x=>x.id==id);
 if(!p) return;
 openAdmin();
 if(!isAdmin){ alert("আগে Login করুন"); return; }
 document.getElementById("loginDiv").style.display="none";
 document.getElementById("writeDiv").style.display="block";
 document.getElementById("editId").value=p.id;
 document.getElementById("pTitle").value=p.title;
 document.getElementById("pText").value=p.text;
}

loadPoems();
</script>
</body>
</html>
