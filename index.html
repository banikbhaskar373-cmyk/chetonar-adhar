<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ভাস্কর ডিজিটাল স্টুডিও</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#fff6e8;font-family:system-ui}
.app{width:100%;min-height:100vh;background:#fffaf3;padding-bottom:110px}
.header{background:linear-gradient(135deg,#4a00e0,#8e2de2);padding:18px 10px 12px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
.diya{width:80px;height:80px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;border:2.5px solid #ffcc33;box-shadow:0 0 18px #ffcc33;margin:0 auto}
.header h1{font-size:24px;color:#00FF7F;line-height:1.25;font-weight:700;margin-top:8px}
.highlight-box{width:100%;background:linear-gradient(90deg,#fff8c0,#ffffff);color:#4a00e0;padding:8px 5px;border-radius:14px;font-size:21px;font-weight:900;text-align:center;margin-top:12px;border:2.5px solid #ffcc33;box-shadow:0 0 18px #ffe680, 0 5px 15px #0004;letter-spacing:0.8px;animation:glow 4s infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px #ffe680, 0 5px 15px #0004}to{box-shadow:0 0 22px #ffcc33, 0 5px 15px #0004}}
.search{margin:12px 10px 0 10px;background:#fff;border-radius:14px;height:46px;display:flex;align-items:center;padding:0 12px;box-shadow:0 6px 16px #0002}
.search input{flex:1;border:none;outline:none;font-size:14px;margin-left:6px}
.sec{padding:14px 10px 0 10px}.sec h2{font-size:16px;display:flex;justify-content:space-between;margin-bottom:10px}.sec h2 span{font-size:11px;color:#ff6a2a}
.pill{height:60px;min-height:60px;max-height:60px;border-radius:30px;padding:0 16px;margin:8px 0;display:flex;gap:12px;align-items:center;color:#fff;cursor:pointer;box-sizing:border-box;overflow:hidden}
.pill b{display:block;font-size:15px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill small{display:block;font-size:11px;line-height:12px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ic{width:34px;height:34px;min-width:34px;max-width:34px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px}
.poem{display:none;background:#fffbe0;border:2px solid #ffd36a;border-radius:10px;padding:12px;margin:5px 0 10px 0;white-space:pre-line;font-size:13px;line-height:1.9;color:#222}
.g{background:linear-gradient(90deg,#0bb36a,#3ed68a)}.o{background:linear-gradient(90deg,#ff7e1a,#ffb02e)}.b{background:linear-gradient(90deg,#2d7bff,#5a9bff)}.pu{background:linear-gradient(90deg,#6b4cff,#8a6cff)}.pi{background:linear-gradient(90deg,#ff4a8a,#ff7ca8)}.te{background:linear-gradient(90deg,#0faa9a,#2fd18c)}.re{background:linear-gradient(90deg,#ff3a2e,#ff7a3d)}.in{background:linear-gradient(90deg,#5a5aff,#8a5aff)}
.bottom{position:fixed;left:0;right:0;bottom:0;height:56px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:999}
.bi{font-size:9px;color:#888;text-align:center}.bi.on{color:#e14a2a;font-weight:700}.bi div{font-size:18px}
.addBtn{position:fixed;right:18px;bottom:70px;width:56px;height:56px;background:#4a00e0;color:#fff;border-radius:50%;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0004;cursor:pointer;z-index:1000}
.modal{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#0008;z-index:2000;align-items:center;justify-content:center}
.modalBox{background:#fff;width:90%;max-width:360px;border-radius:14px;padding:14px}
.modalBox input,.modalBox textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:8px;font-size:14px;outline:none}
.modalBox button{width:100%;margin-top:10px;background:#4a00e0;color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;font-weight:700}
.my-card{border-radius:18px;padding:14px 16px;margin:10px 0;color:#fff;position:relative}
.my-card h3{font-size:16px;margin-bottom:4px}
.my-card p{font-size:13px;white-space:pre-line;opacity:0.95;line-height:1.5}
.my-actions{margin-top:10px;display:flex}
.my-actions button{width:100%;border:none;padding:8px 0;border-radius:20px;font-weight:700;font-size:12px;background:#fff;color:#222}
</style></head><body>
<div class="app">
<div class="header">
<div class="diya">🪔</div>
<h1>ভাস্কর ডিজিটাল<br>স্টুডিওর প্রথম নিবেদন</h1>
<div class="highlight-box">❤️ বিবেকের আলোক দর্শন ❤️</div>
</div>
<div class="search">🔍<input id="searchBox" placeholder="কবিতা খুঁজুন..."></div>
<div class="sec">
<h2>আজকের কবিতা <span>সব দেখুন ›</span></h2>
<h2 style="margin-top:14px">আমার লেখা <span id="count">লোড হচ্ছে...</span></h2>
<div id="myPoems"></div>

<div id="oldPoems"></div>
</div>
<div class="addBtn" onclick="openModal()">+</div>
<div class="bottom"><div class="bi on"><div>🏠</div>হোম</div><div class="bi"><div>🤍</div>পছন্দ</div><div class="bi"><div>📚</div>লাইব্রেরী</div><div class="bi"><div>👤</div>প্রোফাইল</div></div>
</div>
<div class="modal" id="modal"><div class="modalBox">
<h3>নতুন কবিতা যোগ করুন</h3>
<input id="t" placeholder="কবিতার নাম">
<textarea id="c" rows="6" placeholder="কবিতা লিখুন..."></textarea>
<button onclick="savePoem()">সেভ করুন</button>
<button onclick="closeModal()" style="background:#eee;color:#333">বাতিল</button>
</div></div>
<script>
// ✅ আপনার নতুন ব্ল্যাঙ্ক সিটের লিংক - কারেকশন করা
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxrf0LOVVt6YWl2oKDtxmumr62GDmrAsUJOFEXQ4s93DGBd7RAbBIolG3UNP15Bc17BOA/exec';

let colors=['g','o','b','pu','pi','te','re','in'];
let allData=[];
function loadPoems(){
  fetch(SHEET_URL)
  .then(r=>r.json())
  .then(data=>{
    allData=data;
    let box=document.getElementById('myPoems');
    let filtered=data.filter(po=>po.title && po.text);
    document.getElementById('count').innerText='('+filtered.length+'টি)';
    box.innerHTML='';
    if(filtered.length==0){
        box.innerHTML='<div style="text-align:center;padding:40px 10px;color:#888;background:#fff;border-radius:14px;margin-top:10px">✨ এখনো কোনো কবিতা নেই<br>নিচের + বাটনে চেপে প্রথম কবিতা লিখুন<br>এটাই আপনার নতুন ব্ল্যাঙ্ক খাতা</div>';
        return;
    }
    filtered.reverse().forEach((po, idx)=>{
      let serial = filtered.length - idx;
      let col=colors[po.id % colors.length];
      box.innerHTML+=`<div class="my-card ${col}"><h3>${serial}. ${po.title}</h3><p>${po.text}</p><div class="my-actions"><button onclick="editPoem(${po.id})">✏️ এডিট করুন</button></div></div>`;
    });
  }).catch(e=>{
    document.getElementById('count').innerText='(নেট নেই)';
  });
}
function openModal(){document.getElementById('modal').style.display='flex';}
function closeModal(){document.getElementById('modal').style.display='none';}
function savePoem(){
  let title=document.getElementById('t').value.trim();
  let text=document.getElementById('c').value.trim();
  if(!title||!text){alert('নাম ও কবিতা লিখুন');return;}
  let now=new Date().toLocaleString('bn-BD');
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({title:title,text:text,date:now})});
  document.getElementById('t').value='';document.getElementById('c').value='';
  closeModal();
  alert('সেভ হয়েছে! 3 সেকেন্ড পর দেখাবে');
  setTimeout(loadPoems,3000);
}
function editPoem(id){
  let pass = prompt('এডিট পাসওয়ার্ড দিন গুরুদেব:');
  if(pass !== 'Biboswan @22'){
    if(pass !== null) alert('ভুল পাসওয়ার্ড! এডিট করতে পারবেন না।');
    return;
  }
  let po=allData.find(p=>p.id==id); if(!po)return;
  let newTitle=prompt('নাম এডিট করুন:',po.title); if(newTitle===null)return;
  let newText=prompt('কবিতা এডিট করুন:',po.text); if(newText===null)return;
  if(!newTitle.trim()||!newText.trim()){alert('ফাঁকা রাখা যাবে না');return;}
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'edit',id:id,title:newTitle.trim(),text:newText.trim()})});
  alert('আপডেট হচ্ছে গুরুদেব...'); setTimeout(loadPoems,2500);
  }
document.getElementById('searchBox').addEventListener('input',function(){var val=this.value.toLowerCase().trim();document.querySelectorAll('.my-card').forEach(function(card){var titleEl=card.querySelector('h3');if(!titleEl)return;var title=titleEl.innerText.toLowerCase();if(val===''||title.indexOf(val)>-1){card.style.display='block';}else{card.style.display='none';}});});
loadPoems();
</script>
</body></html>
